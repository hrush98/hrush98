<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harrison Rush profile banner</title>
  <desc id="desc">A dark technical banner with graph nodes, model traces, and terminal-style labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#14212f"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="40" x2="1060" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <path d="M80 246 C222 178 282 214 405 136 C542 49 642 62 790 129 C916 186 995 168 1120 83" stroke="url(#accent)" stroke-width="3" opacity="0.85"/>
  <path d="M80 250 C222 182 282 218 405 140 C542 53 642 66 790 133 C916 190 995 172 1120 87" stroke="url(#accent)" stroke-width="13" opacity="0.08"/>
  <g opacity="0.18" stroke="#94a3b8">
    <path d="M0 80H1200"/>
    <path d="M0 160H1200"/>
    <path d="M0 240H1200"/>
    <path d="M150 0V320"/>
    <path d="M300 0V320"/>
    <path d="M450 0V320"/>
    <path d="M600 0V320"/>
    <path d="M750 0V320"/>
    <path d="M900 0V320"/>
    <path d="M1050 0V320"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="166" cy="214" r="8" fill="#38bdf8"/>
    <circle cx="284" cy="201" r="7" fill="#22c55e"/>
    <circle cx="407" cy="136" r="9" fill="#38bdf8"/>
    <circle cx="536" cy="72" r="8" fill="#22c55e"/>
    <circle cx="666" cy="80" r="7" fill="#f59e0b"/>
    <circle cx="792" cy="129" r="9" fill="#38bdf8"/>
    <circle cx="934" cy="178" r="8" fill="#22c55e"/>
    <circle cx="1080" cy="111" r="7" fill="#f59e0b"/>
  </g>
  <g opacity="0.9">
    <rect x="72" y="54" width="336" height="120" rx="14" fill="#0f172a" stroke="#263449"/>
    <circle cx="98" cy="80" r="6" fill="#ef4444"/>
    <circle cx="120" cy="80" r="6" fill="#f59e0b"/>
    <circle cx="142" cy="80" r="6" fill="#22c55e"/>
    <text x="96" y="116" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22">models -> replay -> calibration</text>
    <text x="96" y="148" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">rl | gnn | forecasting | infra</text>
  </g>
  <g>
    <text x="468" y="122" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="700">Harrison Rush</text>
    <text x="470" y="168" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">machine learning systems for decisions under uncertainty</text>
    <rect x="470" y="196" width="128" height="34" rx="17" fill="#0f2f44" stroke="#38bdf8" opacity="0.95"/>
    <text x="490" y="219" fill="#bae6fd" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="600">RL + GNNs</text>
    <rect x="612" y="196" width="142" height="34" rx="17" fill="#0f2f23" stroke="#22c55e" opacity="0.95"/>
    <text x="632" y="219" fill="#bbf7d0" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="600">Calibration</text>
    <rect x="768" y="196" width="176" height="34" rx="17" fill="#3a2609" stroke="#f59e0b" opacity="0.95"/>
    <text x="789" y="219" fill="#fde68a" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="600">Research Systems</text>
