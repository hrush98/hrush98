<svg width="560" height="300" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Footpump architecture</title>
  <desc id="desc">Multi-source token discovery feeds enrichment, scoring, persistence, and watchlist APIs.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="560" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102019"/>
      <stop offset="1" stop-color="#0b1411"/>
    </linearGradient>
    <style>
      .label{font:600 18px ui-sans-serif,system-ui;fill:#f8fafc}
      .small{font:500 13px ui-sans-serif,system-ui;fill:#d1fae5}
      .box{fill:#10261d;stroke:#2f4b3d;stroke-width:1.5}
      .arrow{stroke:#22c55e;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="560" height="300" rx="18" fill="url(#card)" stroke="#244237"/>
  <text x="28" y="42" class="label">Footpump</text>
  <text x="28" y="66" class="small">early-pump discovery service for token monitoring</text>
  <rect x="30" y="98" width="122" height="74" rx="10" class="box"/>
  <text x="56" y="126" class="small">Birdeye</text>
  <text x="50" y="146" class="small">CoinGecko</text>
  <rect x="216" y="84" width="128" height="102" rx="10" class="box"/>
  <text x="241" y="116" class="small">Normalize</text>
  <text x="249" y="138" class="small">enrich</text>
  <text x="249" y="160" class="small">score</text>
  <rect x="406" y="78" width="122" height="74" rx="10" class="box"/>
  <text x="431" y="108" class="small">DB + Redis</text>
  <text x="435" y="128" class="small">watchlist</text>
  <rect x="406" y="178" width="122" height="56" rx="10" class="box"/>
  <text x="426" y="210" class="small">FastAPI</text>
  <path d="M152 135H213" class="arrow"/>
  <path d="M344 124H403" class="arrow"/>
  <path d="M467 153V175" class="arrow"/>
  <text x="119" y="247" class="small">explainable acceleration score + candidate details</text>
</svg>
