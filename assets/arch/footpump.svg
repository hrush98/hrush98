<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Footpump architecture</title>
  <desc id="desc">Footpump ingests market data, normalizes token state, computes deterministic acceleration scores, persists a watchlist, and exposes a FastAPI surface to downstream research agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1b16"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:24px;fill:#dcfce7}
      .sub{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:14px;fill:#a7f3d0}
      .box{fill:#0f261f;stroke:#2f5c49;stroke-width:1.5}
      .score{fill:#102c23;stroke:#22c55e;stroke-width:1.4}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:650;font-size:15px;fill:#f0fdf4}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:12px;fill:#d1fae5}
      .arrow{stroke:#22c55e;stroke-width:2.5;marker-end:url(#arrow)}
      .soft{stroke:#14b8a6;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#softArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="22" fill="url(#bg)" stroke="#1f3f34"/>
  <text x="32" y="46" class="title">Footpump</text>
  <text x="32" y="70" class="sub">deterministic crypto discovery engine, not a trading bot</text>

  <rect x="34" y="104" width="150" height="176" rx="14" class="box"/>
  <text x="62" y="132" class="label">Market sources</text>
  <text x="58" y="164" class="small">Birdeye screening</text>
  <text x="58" y="188" class="small">CoinGecko metadata</text>
  <text x="58" y="212" class="small">GeckoTerminal pools</text>
  <text x="58" y="236" class="small">DEX Screener</text>
  <text x="58" y="260" class="small">DeFiLlama context</text>

  <rect x="238" y="102" width="128" height="66" rx="12" class="box"/>
  <text x="264" y="130" class="label">Poller</text>
  <text x="258" y="150" class="small">async source loops</text>
  <rect x="238" y="204" width="128" height="78" rx="12" class="box"/>
  <text x="263" y="232" class="label">Normalize</text>
  <text x="263" y="252" class="small">asset identity</text>
  <text x="263" y="270" class="small">provenance</text>

  <rect x="420" y="88" width="136" height="108" rx="12" class="score"/>
  <text x="448" y="122" class="label">Acceleration</text>
  <text x="464" y="142" class="label">score</text>
  <text x="442" y="154" class="small">volume acceleration</text>
  <text x="442" y="171" class="small">activity surge</text>
  <text x="442" y="188" class="small">liquidity growth</text>
  <rect x="420" y="222" width="136" height="92" rx="12" class="score"/>
  <text x="447" y="250" class="label">Watchlist</text>
  <text x="441" y="272" class="small">ranked candidates</text>
  <text x="441" y="292" class="small">score breakdowns</text>

  <rect x="600" y="112" width="88" height="72" rx="12" class="box"/>
  <text x="622" y="144" class="label">FastAPI</text>
  <text x="616" y="164" class="small">contracts</text>
  <rect x="600" y="232" width="88" height="72" rx="12" class="box"/>
  <text x="619" y="263" class="label">Hermes</text>
  <text x="613" y="283" class="small">research agent</text>

  <path d="M184 135H234" class="arrow"/>
  <path d="M302 168V200" class="arrow"/>
  <path d="M366 244C392 244 398 142 416 142" class="arrow"/>
  <path d="M488 196V218" class="arrow"/>
  <path d="M556 268H596" class="arrow"/>
  <path d="M556 142H596" class="arrow"/>
  <path d="M644 184V228" class="soft"/>

  <text x="44" y="342" class="small">Boundary: mechanical discovery only</text>
  <text x="44" y="364" class="small">No social narrative, sentiment, portfolio management, or execution</text>
</svg>
