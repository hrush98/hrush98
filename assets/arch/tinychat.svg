<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TinyChat architecture</title>
  <desc id="desc">TinyChat routes terminal prompts through profile and compatibility configuration to OpenAI-compatible model endpoints, then streams responses and debug traces back to the CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1625"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="80" y1="90" x2="640" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:24px;fill:#f8fafc}
      .sub{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:14px;fill:#94a3b8}
      .box{fill:#101b2d;stroke:#31445e;stroke-width:1.5}
      .box2{fill:#0f2434;stroke:#38bdf8;stroke-width:1.4}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:650;font-size:15px;fill:#e2e8f0}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:12px;fill:#cbd5e1}
      .mono{font-family:Menlo,Consolas,monospace;font-weight:500;font-size:12px;fill:#a5f3fc}
      .arrow{stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}
      .return{stroke:#22c55e;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="22" fill="url(#bg)" stroke="#223044"/>
  <text x="32" y="46" class="title">TinyChat</text>
  <text x="32" y="70" class="sub">Rust terminal chat router for local and self-hosted language models</text>

  <rect x="34" y="112" width="170" height="154" rx="12" class="box"/>
  <rect x="34" y="112" width="170" height="30" rx="12" fill="#1e293b"/>
  <circle cx="54" cy="128" r="5" fill="#ef4444"/>
  <circle cx="72" cy="128" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="128" r="5" fill="#22c55e"/>
  <text x="58" y="170" class="mono">&gt; /profile reasoning</text>
  <text x="58" y="194" class="mono">&gt; explain this diff</text>
  <text x="58" y="226" class="small">CLI session</text>
  <text x="58" y="246" class="small">streaming output</text>

  <rect x="266" y="106" width="168" height="170" rx="14" class="box2"/>
  <text x="314" y="136" class="label">Router</text>
  <rect x="294" y="158" width="112" height="28" rx="7" fill="#122f45" stroke="#38bdf8"/>
  <text x="327" y="177" class="small">direct</text>
  <rect x="294" y="194" width="112" height="28" rx="7" fill="#122f45" stroke="#38bdf8"/>
  <text x="318" y="213" class="small">reasoning</text>
  <rect x="294" y="230" width="112" height="28" rx="7" fill="#122f45" stroke="#38bdf8"/>
  <text x="318" y="249" class="small">tool/agent</text>

  <rect x="266" y="306" width="168" height="58" rx="12" class="box"/>
  <text x="303" y="329" class="label">tinychat.toml</text>
  <text x="292" y="350" class="small">server + model compatibility</text>

  <rect x="510" y="92" width="166" height="64" rx="12" class="box"/>
  <text x="548" y="119" class="label">Local model</text>
  <text x="545" y="139" class="small">llama.cpp / vLLM</text>
  <rect x="510" y="178" width="166" height="64" rx="12" class="box"/>
  <text x="545" y="205" class="label">Remote API</text>
  <text x="536" y="225" class="small">OpenAI-compatible</text>
  <rect x="510" y="264" width="166" height="64" rx="12" class="box"/>
  <text x="544" y="291" class="label">Debug trace</text>
  <text x="538" y="311" class="small">latency + routing</text>

  <path d="M204 190H262" class="arrow"/>
  <path d="M434 156H506" class="arrow"/>
  <path d="M434 210H506" class="arrow"/>
  <path d="M350 276V302" class="arrow"/>
  <path d="M510 295C382 375 206 336 120 270" class="return"/>
  <text x="442" y="374" class="small">responses stream back to the terminal</text>
</svg>
