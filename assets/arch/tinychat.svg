<svg width="560" height="300" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TinyChat architecture</title>
  <desc id="desc">Terminal input routed through profiles and compatibility settings to OpenAI-compatible model endpoints with streaming output.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="560" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <style>
      .label{font:600 18px ui-sans-serif,system-ui;fill:#f8fafc}
      .small{font:500 13px ui-sans-serif,system-ui;fill:#cbd5e1}
      .box{fill:#111f33;stroke:#334155;stroke-width:1.5}
      .arrow{stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="560" height="300" rx="18" fill="url(#card)" stroke="#243244"/>
  <text x="28" y="42" class="label">TinyChat</text>
  <text x="28" y="66" class="small">terminal chat router for local/self-hosted LLMs</text>
  <rect x="34" y="108" width="118" height="62" rx="10" class="box"/>
  <text x="55" y="136" class="small">Terminal</text>
  <text x="55" y="154" class="small">prompt</text>
  <rect x="216" y="88" width="130" height="102" rx="10" class="box"/>
  <text x="246" y="119" class="small">Router</text>
  <text x="239" y="141" class="small">profiles</text>
  <text x="235" y="163" class="small">compat config</text>
  <rect x="408" y="78" width="118" height="74" rx="10" class="box"/>
  <text x="431" y="108" class="small">OpenAI</text>
  <text x="428" y="127" class="small">endpoint</text>
  <rect x="408" y="178" width="118" height="56" rx="10" class="box"/>
  <text x="432" y="210" class="small">Stream</text>
  <path d="M152 139H213" class="arrow"/>
  <path d="M346 125H405" class="arrow"/>
  <path d="M467 153V175" class="arrow"/>
  <path d="M408 215C290 258 172 235 93 173" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="196" y="254" class="small">debug trace + latency visibility</text>
</svg>
